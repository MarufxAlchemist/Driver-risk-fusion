# Vision feature extraction (src/driverisk/features/vision.py, docs/03 section 4.1).
#
# STATUS: PROPOSED VALUES, not yet checked on real faces. The EAR threshold is in the range
# usually quoted for eye-aspect-ratio blink detection (about 0.2); the gaze gains and off-road
# limits are placeholders to be calibrated on the webcam and on DMD, then frozen before any
# model evaluation (same rule as configs/events.yaml).
version: 0.1-proposal

ear_threshold: 0.21          # global default; a per-driver value replaces it after calibration (P4)
blink_max_s: 0.4             # a closure this short or shorter is a blink, longer is not
perclos_min_history_s: 10.0  # PERCLOS is NaN until this much valid eye data is in the window
face_conf_min: 0.5           # contract mask rule (must equal schema.FACE_CONF_MIN)

gaze:
  yaw_gain_deg: 30.0         # iris offset of one half eye-width -> this many degrees of gaze yaw
  pitch_gain_deg: 20.0       # iris offset of one eye-height -> this many degrees of gaze pitch

off_road:                    # gaze outside this box counts as off-road
  abs_yaw_deg: 20.0
  pitch_down_deg: 15.0       # looking down (lap, phone) beyond this
  pitch_up_deg: 20.0
